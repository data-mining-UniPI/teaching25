<div class="ui two column doubling stackable grid container bottom">

<ul>
<li>Lower interpretabilty</li>
</ul>

<h1 id="linear-modeling">Linear modeling</h1>
<div class="ui two column doubling stackable grid container bottom">
<div class="column">
<p>Linear models are simple, generally interpretable, family of models. Typically used for tasks on</p>
<ul>
<li>Representation, e.g., PCA, PLA: can I find an alternative, <em>linear</em> representation of my data?</li>
<li>Classification, e.g., Linear regression: can I predict a variable as a <em>linear</em> model of my data?</li>
</ul>
</div>

<h1 id="ensemble-methods">Ensemble methods</h1>
<p><em>Tackling variance, once more</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" lang="C" data-marpit-pagination="17" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="mitigating-variance-or-not">Mitigating variance... or not</h1>
<p>As highlighted by the bias-variance decomposition, learning algorithms can incur in a variance in terms of generalization. We have seen two strategies to mitigate this:</p>
<ul>
<li>Cross validation: reduce variance by increasing samples</li>
<li>Regularization: reduce variance by reducing capacity</li>
</ul>
<p>There exists a third way, somewhat related, approach: leverage variance.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" lang="C" data-marpit-pagination="18" style="--paginate:true;" data-marpit-pagination-total="40">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" lang="C" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="random-forests">Random Forests</h1>
<p>Decision Trees show a moderate variance, and thus are a perfect candidate. Random Forests sample a set of <em>bags</em> by sampling:</p>
<ul>
<li>Random instances, through stratification</li>
<li>Random features within the bag</li>
</ul>
<p>Thus creating learning sets heterogeneous in both instances and features. Bags are sampled with replacement!</p>
</section>

<h1 id="random-forests-computational-complexity">Random forests: computational complexity</h1>
<p>As a bagging model, the computational complexity is given by the complexity of the single tree.</p>
<footer>Remember: in asymptotical terms, constants are not considered.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" lang="C" data-marpit-pagination="24" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="random-forests-1">Random Forests</h1>
<div class="ui segment base pros"> 
<ul>
<li>Simple definition with high variance models</li>
<li>Interpretable-ish results</li>
<li>Fast learning</li>
</ul>
</div>
<div class="ui segment base cons"> 
<ul>
<li>Weak to high degrees of covariance</li>
<li>Sampling <em>with replacement</em>: risk of high correlation</li>
<li>Random bagging</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" lang="C" data-marpit-pagination="25" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="bagging-what">Bagging... what?</h1>
<p>How would <em>you</em> bag?</p>
<div class="img_row centered">
<img class="ui image large centered" src="https://cdn.jsdelivr.net/gh/msetzu/marpee@latest/assets/imgs/probabilities/SVG/data.svg" />
<img class="ui image medium centered" src="https://cdn.jsdelivr.net/gh/msetzu/marpee@latest/assets/imgs/ml/SVG/overfit.svg" />
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" lang="C" data-marpit-pagination="26" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="from-bagging-to-boosting">From bagging... to Boosting</h1>
<p>With bagging models, we assume locality in the data distribution, and thus learn different models on different bags. Up to re-sampling, each instance is uniquely predicted by one model. If models have high-enough bias, then we are not gaining much from bagging data.</p>
<p>The <em>hard</em> bags of bagging are limited by the bias of each model: if none of them are good enough, their number does not matter, and dividing the task yields no advantage. In other words, <strong>in a crowd of weak learners, there's no wisdom to be had</strong>.</p>
<div class="ui compact message quote">
<img class="ui tiny circular left floated image author" src="https://cdn.jsdelivr.net/gh/msetzu/marpee@latest/assets/imgs/people/schapire_square.png" />
<p style="margin: 0;">Why don't we bag the task instead?</p>
<p class="description">Robert E. Schapire, <a href="http://rob.schapire.net/papers/strengthofweak.pdf">The Strength of Weak Learnability.</a></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" lang="C" data-marpit-pagination="27" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="boosting">Boosting</h1>
<p>Boosting creates <em>fuzzy soft</em> bags, wherein instances are jointly predicted by all models, thus <strong>decomposing the task</strong>, rather than the data!</p>
<div class="img_row centered">
<img class="ui image large centered" src="https://cdn.jsdelivr.net/gh/msetzu/marpee@latest/assets/imgs/probabilities/SVG/bagging.svg" />
<img class="ui image large centered" src="https://cdn.jsdelivr.net/gh/msetzu/marpee@latest/assets/imgs/probabilities/SVG/boostingcolored.svg" />
</div>
<div class="caption">
<p>Bagging VS Boosting. In bagging, each bag is used to learn a model. In boosting, bags are <em>fuzzy</em>, and the task is decomposed so that each model predicts a subset of it.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" lang="C" data-marpit-pagination="28" style="--paginate:true;" data-marpit-pagination-total="40">

<h1 id="the-gradient-in-boosting-residuals">The gradient in boosting: residuals</h1>
<div class="ui two column doubling stackable grid container bottom">

<h1 id="boosting-and-its-many-flavors">Boosting and its many flavors</h1>
<ul>
<li><strong>Adaboost.</strong> Uses an exponential loss, adapts <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.489ex;" xmlns="http://www.w3.org/2000/svg" width="1.124ex" height="1.489ex" role="img" focusable="false" viewBox="0 -442 497 658"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D702" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q156 442 175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336V326Q503 302 439 53Q381 -182 377 -189Q364 -216 332 -216Q319 -216 310 -208T299 -186Q299 -177 358 57L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> with a closed form search</li>
<li><strong>Gradient-Boosted Trees.</strong> Leverage Decision Trees as models</li>
<li><strong>XGBoost.</strong> Leverages trees, and uses a more robust loss approximation through the Hessian, rather than the gradient</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" lang="C" data-marpit-pagination="37" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="boosting-and-bagging-regularization">Boosting and bagging: regularization</h1>
<p>Regularization is performed directly on the weak learners (to make sure we keep variance high), but can be applied post-hoc too through pruning!</p>
</section>

<h1 id="boosting-1">Boosting</h1>
<div class="ui two column doubling stackable grid container bottom">
<div class="column">
<div class="ui segment base pros"> 
<ul>
<li>Model-agnostic</li>
<li>Given some relatively likely theoretical assumptions, has extremely low bias</li>
<li>Unlikely to overfit</li>
<li>Computationally quick</li>
</ul>
</div>
<div class="ui segment base cons"> 
<ul>
<li>Largely uninterpretable</li>
</ul>
</div>
</div>
